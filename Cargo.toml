[package]
name = "agent-relay"
version = "0.1.0"
edition = "2024"
description = "A tiny MCP relay server that lets AI coding agents on different machines exchange messages."
license = "MIT"
repository = "https://github.com/densuke/agent-relay"

[dependencies]
# HTTP サーバ。tokio の必要な機能だけを取る（常駐メモリを抑えるため）
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# バイナリを小さくする。e2(RAM 955MB・利用可能298MB)へ常駐させるため
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
